[package]
name = "lab8"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.4.0"
tokio = { version = "1.36.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5.3"
threadpool = "1.8.1"
chrono = "0.4.31"
env_logger = "0.10.1"
log = "0.4.20"
num_cpus = "1.16.0"
rand = "0.8.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
